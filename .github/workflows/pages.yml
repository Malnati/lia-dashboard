name: Deploy lia-dashboard to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-lia-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: https://api.aneety.com
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      LIA_E2E_ENABLED: ${{ secrets.LIA_E2E_ADMIN_EMAIL != '' && secrets.LIA_E2E_ADMIN_PASSWORD != '' && secrets.LIA_E2E_LIMITED_EMAIL != '' && secrets.LIA_E2E_LIMITED_PASSWORD != '' && secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}
      LIA_E2E_ADMIN_EMAIL: ${{ secrets.LIA_E2E_ADMIN_EMAIL }}
      LIA_E2E_ADMIN_PASSWORD: ${{ secrets.LIA_E2E_ADMIN_PASSWORD }}
      LIA_E2E_LIMITED_EMAIL: ${{ secrets.LIA_E2E_LIMITED_EMAIL }}
      LIA_E2E_LIMITED_PASSWORD: ${{ secrets.LIA_E2E_LIMITED_PASSWORD }}
      PLAYWRIGHT_DASHBOARD_URL: https://dashboard.aneety.com/
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lia-dashboard --branch=main
      - name: Install Playwright Chromium
        if: ${{ env.LIA_E2E_ENABLED == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Run published dashboard E2E
        if: ${{ env.LIA_E2E_ENABLED == 'true' }}
        run: pnpm test:e2e
